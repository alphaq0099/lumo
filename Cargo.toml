[package]
name = "lumo"
version = "0.2.10"
edition = "2024"
description = "A fast, lightweight image viewer with album navigation and basic editing"

[features]
default = ["jxl", "pdf", "svg"]
jxl = ["dep:jxl-oxide"]
pdf = ["dep:pdfium-render"]
svg = ["dep:resvg"]
# heic/heif requires a system libheif (see README)
heic = []

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
eframe = { version = "0.37.0", features = ["glow"] }
egui = "0.37"
image = { version = "0.25.10", features = ["jpeg", "png", "gif", "webp", "tiff", "dds", "qoi", "ico", "pnm", "bmp", "tga", "avif"] }
jxl-oxide = { version = "0.12.6", optional = true }
natord = "1.0.9"
pdfium-render = { version = "0.9.5", optional = true }
resvg = { version = "0.49.0", optional = true }
rfd = "0.18.0"
unrar = "0.5.8"
zip = "9.4.2"


# unrar_sys's build script used host cfg!(windows), which skipped isn't.cpp
# (unrar's WinNT()/IsWindows11OrGreater) when cross-compiling. Vendored copy
# switches on TARGET instead.
[patch.crates-io]
unrar_sys = { path = "vendor/unrar_sys" }
